# A day's work on Android: sign-in, the institute's rules, an activity made,
# clocked in and out, and the manager's screens. The account comes from
# scripts/seed-emulators.mjs; run by `npx sabeel-ci native-e2e`.
appId: ${APP_ID}
name: Rules, clock in and out, and the manager screens
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Dev sign-in \\(emulator only\\)"
    timeout: 180000
- assertVisible: "volunteer@oursabeel.com"
- tapOn: "Dev: sign in"

# The rules come first, and I agree lets the account in.
- extendedWaitUntil:
    visible: "Before you continue"
    timeout: 60000
- assertVisible: "[\\s\\S]*never abuse another member[\\s\\S]*"
- takeScreenshot: 01-rules
- tapOn: "I agree"
- extendedWaitUntil:
    visible: "Salaam, [\\s\\S]*"
    timeout: 30000
- runFlow:
    when:
      visible: "Not now"
    commands:
      - tapOn: "Not now"

# An activity to work on.
- scrollUntilVisible:
    element: "Activities"
- tapOn: "Activities"
- tapOn: "New activity name"
- inputText: "Teaching"
- hideKeyboard
- tapOn: "Add"
- assertVisible: "Archive"
- runFlow: common/back.yaml

# Clock in on it, and out again.
- scrollUntilVisible:
    element: "Pick an activity[\\s\\S]*"
    direction: UP
- tapOn: "Pick an activity[\\s\\S]*"
- tapOn: "Teaching[\\s\\S]*"
- tapOn: "Clock in"
- extendedWaitUntil:
    visible: "CLOCKED IN"
    timeout: 15000
- takeScreenshot: 02-clocked-in
- tapOn: "Clock out"
- extendedWaitUntil:
    visible: "Clock in"
    timeout: 15000
- assertNotVisible: "CLOCKED IN"

# The manager's screens open, each with something only it shows.
- scrollUntilVisible:
    element: "My timesheet"
- tapOn: "My timesheet"
- assertVisible: "[\\s\\S]*– [\\s\\S]*"
- takeScreenshot: 03-timesheet
- runFlow: common/back.yaml
- scrollUntilVisible:
    element: "Reports"
- tapOn: "Reports"
- assertVisible: "Period"
- runFlow: common/back.yaml
- scrollUntilVisible:
    element: "Approvals"
- tapOn: "Approvals"
- assertVisible: "Assigned to me"
- runFlow: common/back.yaml
- scrollUntilVisible:
    element: "Manage users"
- tapOn: "Manage users"
- assertVisible: "[\\s\\S]*volunteer@oursabeel.com[\\s\\S]*"
- takeScreenshot: 04-users
