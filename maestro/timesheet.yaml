# A day's work: sign-in, the institute's rules, an activity made, clocked in
# and out, and the manager's screens. The account comes from
# scripts/seed-emulators.mjs; run by `npx sabeel-ci native-e2e`. Each step that
# moves the app on checks that it did (ci-tools/tap-until.yaml,
# back-until.yaml): a busy CI simulator drops taps that land before a screen
# takes them, and a step is taken again only while its screen still shows.
appId: ${APP_ID}
name: Rules, clock in and out, and the manager screens
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Dev sign-in \\(emulator only\\)"
    timeout: 180000
- assertVisible: "volunteer@oursabeel.com"
- runFlow:
    file: ci-tools/tap-until.yaml
    env:
      TARGET: "Dev: sign in"
      EXPECT: "Before you continue"
      SECONDS: 60

# The rules come first, and I agree lets the account in.
- assertVisible: "[\\s\\S]*never abuse another member[\\s\\S]*"
- takeScreenshot: 01-rules
- runFlow:
    file: ci-tools/tap-until.yaml
    env:
      TARGET: "I agree"
      EXPECT: "Salaam, [\\s\\S]*"
      SECONDS: 30
- runFlow:
    when:
      visible: "Not now"
    commands:
      - tapOn: "Not now"

# An activity to work on, its name read back before it is added: a keystroke
# the busy simulator drops would otherwise add a misspelt activity. A retry
# erases what the last try left, which is at most the start of "Teaching",
# left-aligned in a full-width field: the tap at its centre lands after it, so
# eraseText takes all of it.
- scrollUntilVisible:
    element: "Activities"
- runFlow:
    file: ci-tools/tap-until.yaml
    env:
      TARGET: "Activities"
      EXPECT: "New activity name"
      SECONDS: 30
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            notVisible: "Archive"
          commands:
            - tapOn:
                id: "activity-name"
            - eraseText: 30
            - inputText: "Teaching"
            - assertVisible:
                id: "activity-name"
                text: "Teaching"
            - hideKeyboard
            - tapOn: "Add"
      - extendedWaitUntil:
          visible: "Archive"
          timeout: 30000
- runFlow:
    file: ci-tools/back-until.yaml
    env:
      FROM: "New activity name"

# Clock in on it, and out again.
- scrollUntilVisible:
    element: "Pick an activity[\\s\\S]*"
    direction: UP
- runFlow:
    file: ci-tools/tap-until.yaml
    env:
      TARGET: "Pick an activity[\\s\\S]*"
      EXPECT: "Teaching[\\s\\S]*"
      SECONDS: 30
- tapOn: "Teaching[\\s\\S]*"
- runFlow:
    file: ci-tools/tap-until.yaml
    env:
      TARGET: "Clock in"
      EXPECT: "CLOCKED IN"
      SECONDS: 30
- takeScreenshot: 02-clocked-in
- runFlow:
    file: ci-tools/tap-until.yaml
    env:
      TARGET: "Clock out"
      EXPECT: "Clock in"
      SECONDS: 30
- assertNotVisible: "CLOCKED IN"

# The manager's screens open, each with something only it shows. Each
# screen's title is the row that opened it, so Back waits for what only the
# screen being left shows to go.
- scrollUntilVisible:
    element: "My timesheet"
- runFlow:
    file: ci-tools/tap-until.yaml
    env:
      TARGET: "My timesheet"
      EXPECT: "‹"
      SECONDS: 30
- assertVisible: "[\\s\\S]*– [\\s\\S]*"
- takeScreenshot: 03-timesheet
- runFlow:
    file: ci-tools/back-until.yaml
    env:
      FROM: "‹"
- scrollUntilVisible:
    element: "Reports"
- runFlow:
    file: ci-tools/tap-until.yaml
    env:
      TARGET: "Reports"
      EXPECT: "Period"
      SECONDS: 30
- runFlow:
    file: ci-tools/back-until.yaml
    env:
      FROM: "Period"
- scrollUntilVisible:
    element: "Approvals"
- runFlow:
    file: ci-tools/tap-until.yaml
    env:
      TARGET: "Approvals"
      EXPECT: "Assigned to me"
      SECONDS: 30
- runFlow:
    file: ci-tools/back-until.yaml
    env:
      FROM: "Assigned to me"
- scrollUntilVisible:
    element: "Manage users"
- runFlow:
    file: ci-tools/tap-until.yaml
    env:
      TARGET: "Manage users"
      EXPECT: "[\\s\\S]*volunteer@oursabeel.com[\\s\\S]*"
      SECONDS: 30
- takeScreenshot: 04-users
