name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21 (Firebase emulators require Java 21+)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@^15

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Keeps the 2026-07-20 dead-code audit from rotting. knip.json teaches it
      # this stack's shapes (platform seams and scripts are entry points) — read
      # the comments there before "fixing" anything it reports.
      - name: Dead-code audit (knip)
        run: npm run knip

      - name: Unit tests
        run: npm test

      # The functions emulator reads Secret Manager secrets from this gitignored
      # file. The push senders bind APNS_KEY (functions/src/messaging.ts); the
      # emulated ones send nothing, so a placeholder is all it needs.
      - name: Emulator stand-ins for secrets
        run: printf 'APNS_KEY=unused-in-emulator\n' > functions/.secret.local

      - name: Emulator integration tests
        run: npm run test:emulator

      # The browser the sweep drives. Playwright's own Chromium, not a system
      # Chrome — that is what makes this step possible on a bare runner, and
      # functions/test/unit/ci-coverage.test.ts fails if this line disappears.
      - name: Install Chromium for the layout sweep
        run: npx playwright install --with-deps chromium

      # Every screen at five widths straddling the breakpoint, ASSERTED (page
      # never scrolls sideways, nothing past the right edge, no two same-layer
      # controls overlap, every screen has a way out, the width produced the
      # layout it should). It starts its own emulators and serves its own web
      # export — see scripts/screens-e2e.mjs and docs/DEV-TOOLING.md.
      - name: Layout sweep (every screen, five widths)
        run: npm run test:screens

      # A failing sweep is a layout failure, and a layout failure is something
      # you have to LOOK at. Without the shots, CI reports "the page scrolls
      # sideways by 40px" and nobody can see what did it.
      - name: Screens from the sweep
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screens-sweep
          path: e2e-shots/screens/
          retention-days: 7
