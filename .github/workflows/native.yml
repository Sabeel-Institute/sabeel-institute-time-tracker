# Rendered from Sabeel-Institute/ci-tools workflows/native.yml by
# `npx sabeel-ci workflows`: edit it there, not here.
name: Native

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - maestro/**
      - scripts/seed-emulators.mjs
      - ci-tools.json
      - package-lock.json
      - .github/workflows/native.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

env:
  SENTRY_DISABLE_AUTO_UPLOAD: "true"

jobs:
  android:
    if: github.repository_owner == 'Sabeel-Institute'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: ci-tools, at the commit package-lock.json pins
        run: |
          sha=$(jq -er '.packages["node_modules/@sabeel-institute/ci-tools"].resolved | capture("#(?<sha>[0-9a-f]{40})$").sha' package-lock.json)
          git clone --quiet --no-checkout https://github.com/Sabeel-Institute/ci-tools.git "$RUNNER_TEMP/ci-tools"
          if ! git -C "$RUNNER_TEMP/ci-tools" merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::ci-tools $sha is not on ci-tools' main branch"
            exit 1
          fi
          git -C "$RUNNER_TEMP/ci-tools" checkout --quiet --detach "$sha"
          npm ci --prefix "$RUNNER_TEMP/ci-tools" --omit=dev --ignore-scripts --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/ci-tools-bin"
          ln -s "$RUNNER_TEMP/ci-tools/bin/sabeel-ci.mjs" "$RUNNER_TEMP/ci-tools-bin/sabeel-ci"
          echo "$RUNNER_TEMP/ci-tools-bin" >> "$GITHUB_PATH"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Install dependencies
        run: npm ci
      - name: Android SDK packages, with retries
        run: sabeel-ci ci-android-sdk
      - name: Install Firebase CLI
        id: firebase-cli
        run: |
          npm install --global firebase-tools@^15
          echo "version=$(firebase --version)" >> "$GITHUB_OUTPUT"
      # The emulators' jars and the Emulator UI download on their first start, and
      # a download that fails ends the emulators: kept per Firebase CLI version.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ steps.firebase-cli.outputs.version }}
      - name: Boot an Android emulator
        run: sabeel-ci ci-avd
      - name: Install Maestro
        run: sabeel-ci install-maestro
      - name: Native flows
        run: sabeel-ci native-e2e
      - name: Screens, Maestro's report and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ github.sha }}
          path: shots/native/
          retention-days: 14

  ios:
    if: github.repository_owner == 'Sabeel-Institute' && (startsWith(github.ref, 'refs/tags/v') || github.event_name != 'push')
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      # Spotlight indexes every file the install and the build write, on a
      # runner whose few cores the simulator already saturates (load averages
      # past 300 in the flows). The flows' taps and keystrokes need what is left.
      - name: Stop Spotlight indexing
        run: sudo mdutil -a -i off
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: ci-tools, at the commit package-lock.json pins
        run: |
          sha=$(jq -er '.packages["node_modules/@sabeel-institute/ci-tools"].resolved | capture("#(?<sha>[0-9a-f]{40})$").sha' package-lock.json)
          git clone --quiet --no-checkout https://github.com/Sabeel-Institute/ci-tools.git "$RUNNER_TEMP/ci-tools"
          if ! git -C "$RUNNER_TEMP/ci-tools" merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::ci-tools $sha is not on ci-tools' main branch"
            exit 1
          fi
          git -C "$RUNNER_TEMP/ci-tools" checkout --quiet --detach "$sha"
          npm ci --prefix "$RUNNER_TEMP/ci-tools" --omit=dev --ignore-scripts --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/ci-tools-bin"
          ln -s "$RUNNER_TEMP/ci-tools/bin/sabeel-ci.mjs" "$RUNNER_TEMP/ci-tools-bin/sabeel-ci"
          echo "$RUNNER_TEMP/ci-tools-bin" >> "$GITHUB_PATH"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm ci
      - name: Install Firebase CLI
        id: firebase-cli
        run: |
          npm install --global firebase-tools@^15
          echo "version=$(firebase --version)" >> "$GITHUB_OUTPUT"
      # The emulators' jars and the Emulator UI download on their first start, and
      # a download that fails ends the emulators: kept per Firebase CLI version.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ steps.firebase-cli.outputs.version }}
      - name: Install Maestro
        run: sabeel-ci install-maestro
      - name: Native flows on the iOS simulator
        run: sabeel-ci native-e2e --ios
      - name: Screens, Maestro's report and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-ios-${{ github.sha }}
          path: |
            shots/native/
            !shots/native/ios-build/
          retention-days: 14
